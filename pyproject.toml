[project]
name = "clope"
version = "1.1"
description = "Python package for interacting with the Cantaloupe/Seed vending system (Spotlight, Snowflake, and Prepick APIs)."
readme = "README.md"
authors = [{ name = "Jordan Maynor", email = "jmaynor@pepsimidamerica.com" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license-files = ["LICENSE"]
license= "Unlicense"

[project.optional-dependencies]
spotlight = [
    "httpx2",
    "openpyxl",
    "pandas",
    "tenacity",
]
snow = [
    "pandas",
    "snowflake-connector-python[pandas]>=4.7.4",
]
prepick = [
    "zeep[async]>=4.3.3",
]
all = [
    "clope[spotlight]",
    "clope[snow]",
    "clope[prepick]",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.7.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clope"
module-root = ""
source-exclude = ["tests/**", "*.p8", "*.pub"]
