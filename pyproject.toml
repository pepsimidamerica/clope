[project]
name = "clope"
version = "1.0"
description = "Python package for interacting with the Cantaloupe/Seed vending system (Spotlight, Snowflake, and Prepick APIs)."
readme = "README.md"
authors = [{ name = "Jordan Maynor", email = "jmaynor@pepsimidamerica.com" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license-files = ["LICENSE"]

[project.optional-dependencies]
spotlight = [
    "httpx2",
    "openpyxl",
    "pandas",
    "tenacity",
]
snow = [
    "pandas",
    "snowflake-connector-python[pandas]>=4.0.0",
]
prepick = [
    "zeep[async]>=4.3.3",
]
all = [
    "clope[spotlight]",
    "clope[snow]",
    "clope[prepick]",
]
